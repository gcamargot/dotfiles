# ==============================================================================
# Tmux Configuration
# ==============================================================================

# Fast response time for Neovim (eliminate ESC key delay)
set -s escape-time 0

# True color support
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Increase history limit
set -g history-limit 20000

# Start window and pane numbering from 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support (scrolling, selecting panes, resizing)
set -g mouse on

# Vi-style navigation and copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard"

# Easy pane splitting in same working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy reload of tmux config
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
